            listHtml = '<div style="padding:18px 0 4px;text-align:center;font-size:12px;color:var(--muted)">아직 등록된 개인 챌린지가 없습니다. 새 챌린지 버튼을 눌러 목표 거리에 도전해 보세요.</div>';
          } else if (filtered.length === 0) {
            listHtml = '<div style="padding:18px 0;text-align:center;font-size:12px;color:var(--muted)">해당 상태의 챌린지가 없습니다.</div>';
          } else {
            listHtml = '<div class="list-divide" style="margin-top:12px">' + filtered.map(function (c) {
              var isDone = c.completedAt !== null;
              var curKm = c.targetDistanceKm;
              if (!isDone) {
                var eligible = state.runs.filter(function (r) {
                  return (r.recordedAt || r.endedAt || r.startedAt) >= c.createdAt;
                });
                if (c.mode === 'single_run') {
                  var maxR = eligible.reduce(function (m, r) { return Math.max(m, r.distanceKm); }, 0);
                  curKm = Math.max(maxR, state.isRunning ? state.distanceKm : 0);
                } else {
                  curKm = eligible.reduce(function (s, r) { return s + r.distanceKm; }, 0) + (state.isRunning ? state.distanceKm : 0);
                }
                curKm = Math.min(c.targetDistanceKm, curKm);
              }
              var pct = Math.min(100, Math.round((curKm / c.targetDistanceKm) * 100));
              return (
                '<div style="padding:12px 0;display:flex;flex-direction:column;gap:8px">' +
                  '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
                    '<div style="min-width:0">' +
                      '<div style="font-size:14px;font-weight:700;color:var(--ink)">' + escapeHtml(c.title) + '</div>' +
                      '<div class="card-meta-line tabular-nums">' +
                        '<span>' + (c.mode === 'single_run' ? '1회 완주 목표' : '누적 거리 목표') + '</span>' +
                        '<span>·</span><span class="font-mono" style="font-weight:700;color:' + (isDone ? 'var(--emerald-dark)' : 'var(--ink)') + '">보너스 +' + c.bonusPoints.toLocaleString() + '점</span>' +
                        (isDone && c.completedAt ? '<span>·</span><span style="color:var(--emerald-dark);font-weight:600">달성 (' + new Date(c.completedAt).toLocaleDateString('ko-KR') + ')</span>' : '') +
                      '</div>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">' +
                      '<span class="font-mono" style="font-size:12px;font-weight:700">' + curKm.toFixed(1) + '/' + c.targetDistanceKm + ' km</span>' +
                      (!isDone ? '<button type="button" class="btn btn-outline btn-sm" data-action="delete-challenge" data-id="' + c.id + '">삭제</button>' : '') +
                    '</div>' +
                  '</div>' +
                  '<div style="display:flex;align-items:center;gap:10px">' +
                    '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;background:' + (isDone ? 'var(--emerald)' : 'var(--ink)') + '"></div></div>' +
                    '<span class="font-mono" style="font-size:11px;font-weight:600;color:var(--muted);width:36px;text-align:right">' + pct + '%</span>' +
                  '</div>' +
                '</div>'
              );
            }).join('') + '</div>';
          }

          return (
            '<div class="card">' +
              '<div class="card-header">' +
                '<div>' +
                  '<p class="card-kicker">목표 거리 설정 · 보너스 점수</p>' +
                  '<h3 class="card-title">나만의 챌린지</h3>' +
                  '<div class="card-meta-line tabular-nums">' +
                    '<span>사용 가능 포인트 <strong class="font-mono" style="color:var(--emerald-dark)">' + derived.availableBonusPoints.toLocaleString() + '점</strong></span>' +
                    '<span>·</span><span>완료 <strong class="font-mono" style="color:var(--ink)">' + completedCount + '개</strong></span>' +
                  '</div>' +
                '</div>' +
                '<button type="button" class="btn ' + (state.showChallengeForm ? 'btn-outline' : 'btn-dark') + ' btn-sm" data-action="toggle-challenge-form">' + (state.showChallengeForm ? '닫기' : '+ 새 챌린지') + '</button>' +
              '</div>' +
              formHtml +
              (challenges.length > 0
                ? '<div class="segmented segmented-3" style="margin-top:14px">' +
                    '<button type="button" class="seg-btn ' + (state.challengeFilter === 'all' ? 'active' : '') + '" data-action="ch-filter" data-val="all">전체 (' + challenges.length + ')</button>' +
                    '<button type="button" class="seg-btn ' + (state.challengeFilter === 'active' ? 'active' : '') + '" data-action="ch-filter" data-val="active">진행 중 (' + activeCount + ')</button>' +
                    '<button type="button" class="seg-btn ' + (state.challengeFilter === 'completed' ? 'active' : '') + '" data-action="ch-filter" data-val="completed">달성 (' + completedCount + ')</button>' +
                  '</div>'
                : '') +
              listHtml +
            '</div>'
          );
        }

        function renderProtectionHtml(derived) {
          var now = Date.now();
          var profileId = state.profile ? state.profile.id : '';
          var owned = Object.values(state.tiles).filter(function (t) { return t.ownerId === profileId; });
          var rivals = Object.values(state.tiles).filter(function (t) { return t.ownerId !== profileId; });

          var scored = owned.map(function (tile) {
            var nearest = 99999;
            rivals.forEach(function (r) {
              var d = haversineMeters(tile.center, r.center);
              if (d < nearest) nearest = d;
            });
            return { tile: tile, isShielded: tile.shieldUntil > now, nearest: nearest };
          }).sort(function (a, b) {
            if (a.isShielded !== b.isShielded) return a.isShielded ? 1 : -1;
            return a.nearest - b.nearest;
          });

          var unshielded = scored.filter(function (s) { return !s.isShielded; });
          var shielded = scored.filter(function (s) { return s.isShielded; });
          var bundleCount = Math.min(3, unshielded.length);
          var bundleCost = bundleCount === 3 ? SHIELD_BUNDLE_3_COST : bundleCount * SHIELD_COST_PER_TILE;

          var filtered = scored.filter(function (s) {
            if (state.protectionFilter === 'unshielded') return !s.isShielded;
            if (state.protectionFilter === 'shielded') return s.isShielded;
            return true;
          });

          return (
            '<div class="card">' +
              '<div class="card-header">' +
                '<div>' +
                  '<p class="card-kicker">24시간 침공 면역 · 보너스 포인트 사용</p>' +
                  '<h3 class="card-title">영토 보호 (Territory Protection)</h3>' +
                  '<div class="card-meta-line tabular-nums">' +
                    '<span>사용 가능 포인트 <strong class="font-mono" style="color:var(--amber-dark)">' + derived.availableBonusPoints.toLocaleString() + '점</strong></span>' +
                    '<span>·</span><span>보호 중 <strong class="font-mono" style="color:var(--ink)">' + shielded.length + '/' + scored.length + '칸</strong></span>' +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<div style="margin-top:14px;padding:14px;border-radius:14px;background:var(--surface-soft);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">' +
                '<div style="min-width:0;flex:1">' +
                  '<div style="font-size:13px;font-weight:700">라이벌 인접 최전선 영토 24시간 보호</div>' +
                  '<div style="font-size:12px;color:var(--muted);margin-top:2px">' +
                    (unshielded.length === 0
                      ? (scored.length === 0 ? '러닝으로 영토를 점령하면 보호막을 씌울 수 있습니다.' : '보유 중인 모든 영토가 24시간 보호막으로 보호되고 있습니다.')
                      : '1칸 보호 ' + SHIELD_COST_PER_TILE + '점 · 최전선 ' + bundleCount + '칸 일괄 보호 ' + bundleCost + '점') +
                  '</div>' +
                '</div>' +
                (bundleCount > 0
                  ? '<button type="button" class="btn btn-dark btn-sm" ' + (derived.availableBonusPoints < bundleCost ? 'disabled' : '') + ' data-action="shield-bundle">최전선 ' + bundleCount + '칸 보호 (-' + bundleCost + '점)</button>'
                  : '') +
              '</div>' +
              (state.protectionNotice
                ? '<div style="margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--amber-soft);color:var(--amber-dark);font-size:12px;font-weight:600">' + escapeHtml(state.protectionNotice) + '</div>'
                : '') +
              (scored.length > 0
                ? '<div class="segmented segmented-3" style="margin-top:14px">' +
                    '<button type="button" class="seg-btn ' + (state.protectionFilter === 'all' ? 'active' : '') + '" data-action="prot-filter" data-val="all">전체 (' + scored.length + ')</button>' +
                    '<button type="button" class="seg-btn ' + (state.protectionFilter === 'unshielded' ? 'active' : '') + '" data-action="prot-filter" data-val="unshielded">미보호 (' + unshielded.length + ')</button>' +
                    '<button type="button" class="seg-btn ' + (state.protectionFilter === 'shielded' ? 'active' : '') + '" data-action="prot-filter" data-val="shielded">보호 중 (' + shielded.length + ')</button>' +
                  '</div>' +
                  '<div class="list-divide" style="margin-top:10px;max-height:240px;overflow-y:auto">' +
                    filtered.map(function (item) {
                      var t = item.tile;
                      var mins = Math.max(1, Math.ceil((t.shieldUntil - now) / 60000));
                      var hrs = Math.floor(mins / 60);
                      var remLabel = hrs > 0 ? hrs + '시간 ' + (mins % 60) + '분 남음' : mins + '분 남음';
                      return (
                        '<div style="padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px">' +
                          '<button type="button" style="text-align:left;min-width:0;flex:1" data-action="focus-tile" data-key="' + t.key + '">' +
                            '<div class="font-mono" style="font-size:12px;font-weight:700">섹터 (' + t.q + ', ' + t.r + ')' + (item.nearest < 180 && !item.isShielded ? ' <span style="color:var(--rose)">· 라이벌 인접</span>' : '') + '</div>' +
                            '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + (item.isShielded ? '24시간 보호막 활성 · ' + remLabel : '라이벌까지 ' + Math.round(item.nearest) + 'm · 침공 취약 구역') + '</div>' +
                          '</button>' +
                          (item.isShielded
                            ? '<span class="font-mono" style="font-size:12px;font-weight:700;color:var(--amber-dark);flex-shrink:0">면역 활성</span>'
                            : '<button type="button" class="btn btn-outline btn-sm" ' + (derived.availableBonusPoints < SHIELD_COST_PER_TILE ? 'disabled' : '') + ' data-action="shield-one" data-key="' + t.key + '">보호 (-' + SHIELD_COST_PER_TILE + '점)</button>') +
                        '</div>'
                      );
                    }).join('') +
                  '</div>'
                : '') +
            '</div>'
          );
        }

        function renderAchievementsHtml(derived) {
          var list = derived.achievements;
          var unlockedCount = derived.earnedBadges.length;
          var filtered = list.filter(function (a) {
            if (state.achievementFilter === 'unlocked') return a.unlocked;
            if (state.achievementFilter === 'in-progress') return !a.unlocked;
            return true;
          });

          return (
            '<div class="card">' +
              '<div class="card-header">' +
                '<div>' +
                  '<p class="card-kicker">러너 마일스톤</p>' +
                  '<h3 class="card-title">러닝 업적 트래커</h3>' +
                  '<div class="card-meta-line tabular-nums">' +
                    '<span>달성 <strong class="font-mono" style="color:var(--ink)">' + unlockedCount + '/' + list.length + '</strong></span>' +
                    '<span>·</span><span>현재 스트릭 <strong class="font-mono" style="color:var(--ink)">' + derived.streak.currentStreakDays + '일</strong></span>' +
                    '<span>·</span><span>최고 기록 <strong class="font-mono" style="color:var(--ink)">' + derived.streak.bestStreakDays + '일</strong></span>' +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<div class="segmented segmented-3" style="margin-top:14px">' +
                '<button type="button" class="seg-btn ' + (state.achievementFilter === 'all' ? 'active' : '') + '" data-action="ach-filter" data-val="all">전체 (' + list.length + ')</button>' +
                '<button type="button" class="seg-btn ' + (state.achievementFilter === 'unlocked' ? 'active' : '') + '" data-action="ach-filter" data-val="unlocked">획득 (' + unlockedCount + ')</button>' +
                '<button type="button" class="seg-btn ' + (state.achievementFilter === 'in-progress' ? 'active' : '') + '" data-action="ach-filter" data-val="in-progress">도전 중 (' + (list.length - unlockedCount) + ')</button>' +
              '</div>' +
              (filtered.length === 0
                ? '<div style="padding:24px 0;text-align:center;font-size:12px;color:var(--muted)">표시할 업적이 없습니다.</div>'
                : '<div class="list-divide" style="margin-top:12px">' + filtered.map(function (item) {
                    var expanded = state.expandedAchievementId === item.id;
                    var rem = Math.max(0, Number((item.targetValue - item.currentValue).toFixed(1)));
                    return (
                      '<button type="button" style="width:100%;text-align:left;padding:12px 0;display:flex;align-items:flex-start;gap:12px" data-action="toggle-ach" data-id="' + item.id + '">' +
                        '<div style="width:36px;height:36px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:' + (item.unlocked ? '#ffffff' : 'var(--subtle)') + ';background:' + (item.unlocked ? item.accentHex : 'var(--surface-muted)') + '">' + (item.unlocked ? '★' : '·') + '</div>' +
                        '<div style="flex:1;min-width:0">' +
                          '<div style="display:flex;justify-content:space-between;gap:8px">' +
                            '<span style="font-size:14px;font-weight:700;color:var(--ink)">' + escapeHtml(item.title) + '</span>' +
                            '<span class="font-mono" style="font-size:12px;font-weight:700;color:var(--ink-2)">' + item.currentValue + '/' + item.targetValue + item.unit + '</span>' +
                          '</div>' +
                          '<div class="card-meta-line">' +
                            '<span>' + escapeHtml(item.categoryLabel) + '</span><span>·</span>' +
                            (item.unlocked
                              ? '<span style="color:var(--emerald-dark);font-weight:600">달성 완료' + (item.unlockedAt ? ' (' + new Date(item.unlockedAt).toLocaleDateString('ko-KR') + ')' : '') + '</span>'
                              : '<span>목표까지 ' + rem + item.unit + ' 남음</span>') +
                          '</div>' +
                          '<div style="display:flex;align-items:center;gap:10px;margin-top:8px">' +
                            '<div class="progress-track"><div class="progress-fill" style="width:' + item.progressPct + '%;background:' + (item.unlocked ? item.accentHex : '#64748B') + '"></div></div>' +
                            '<span class="font-mono" style="font-size:11px;color:var(--muted);width:36px;text-align:right">' + item.progressPct + '%</span>' +
                          '</div>' +
                          (expanded ? '<p style="margin:8px 0 0;font-size:12px;color:var(--ink-2)">' + escapeHtml(item.description) + '</p>' : '') +
                        '</div>' +
                      '</button>'
                    );
                  }).join('') + '</div>') +
            '</div>'
          );
        }

        function renderLeaderboardHtml(derived) {
          var totalTiles = derived.leaderboard.reduce(function (s, e) { return s + e.tilesCount; }, 0);
          return (
            '<div class="card">' +
              '<div class="card-header">' +
                '<div>' +
                  '<p class="card-kicker">' + escapeHtml(derived.hub.name) + ' 구역</p>' +
                  '<h3 class="card-title">실시간 영토 보유 랭킹</h3>' +
                '</div>' +
              '</div>' +
              '<div class="list-divide" style="margin-top:12px">' +
                derived.leaderboard.map(function (entry, idx) {
                  var share = totalTiles > 0 ? Math.round((entry.tilesCount / totalTiles) * 100) : 0;
                  var bonus = entry.isUser ? derived.totalEarnedBonusPoints : 0;
                  var totalScore = entry.tilesCount * 100 + bonus;
                  return (
                    '<div style="padding:12px ' + (entry.isUser ? '10px' : '0') + ';display:flex;align-items:center;justify-content:space-between;gap:10px;' + (entry.isUser ? 'background:var(--emerald-soft);border-radius:12px;margin:4px 0;' : '') + '">' +
                      '<div style="display:flex;align-items:center;gap:10px;min-width:0">' +
                        '<span class="font-mono" style="width:22px;text-align:center;font-weight:700;color:var(--muted)">' + (idx + 1) + '</span>' +
                        '<span style="width:12px;height:12px;border-radius:3px;background:' + entry.color + ';flex-shrink:0"></span>' +
                        '<div style="min-width:0">' +
                          '<div style="font-size:14px;font-weight:700" class="truncate">' + escapeHtml(entry.ownerName) + (entry.isUser ? ' (나)' : '') + '</div>' +
                          '<div style="font-size:12px;color:var(--muted)" class="tabular-nums">점유율 ' + share + '% · ' + entry.areaSqm.toLocaleString() + ' m²' + (bonus > 0 ? ' · 보너스 +' + bonus.toLocaleString() + '점' : '') + '</div>' +
                        '</div>' +
                      '</div>' +
                      '<div style="text-align:right;flex-shrink:0">' +
                        '<div class="font-mono" style="font-size:15px;font-weight:700">' + entry.tilesCount + '칸</div>' +
                        '<div class="font-mono" style="font-size:11px;color:var(--muted)">' + totalScore.toLocaleString() + '점</div>' +
                      '</div>' +
                    '</div>'
                  );
                }).join('') +
              '</div>' +
            '</div>'
          );
        }

                    '</div>' +
                  '</button>'
                );
              }).join('') +
            '</div>'

        function renderSettingsHtml(derived) {
          var profile = state.profile;

                  '</div>' +

        /* =========================================================
         * 8. INTERACTIVE MAP SYNC (LEAFLET + CANVAS FALLBACK)
         * =======================================================*/
        function syncLeafletMap(derived) {
          var mapEl = document.getElementById('leaflet-map');
          if (!mapEl || typeof window.L === 'undefined') return;
          var hub = derived.hub;
          var now = Date.now();
          var profileId = state.profile ? state.profile.id : '';

          if (!leafletMap || !mapEl._leaflet_id) {
            leafletMap = L.map(mapEl, { zoomControl: true, attributionControl: true }).setView(
              [hub.center.lat, hub.center.lng],
              15
            );
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '&copy; OpenStreetMap',
            }).on('tileerror', function () {
              // If tiles cannot load offline, user can still use Tactical Canvas automatically or via switch
            }).addTo(leafletMap);

            leafletTileLayers = {};
            leafletPendingLayers = {};
            leafletShieldMarkers = [];
            leafletRunnerMarker = null;
            leafletStartMarker = null;
            leafletCourseMarker = null;
            leafletActivePolyline = null;
            leafletCoursePolyline = null;
            leafletHistoryPolyline = null;
            lastMapHubKey = hub.center.lat + ',' + hub.center.lng;

            leafletMap.on('click', function (ev) {
              if (state.isRunning && !state.isPaused && state.inputMode === 'manual-click') {
                var lastPt = state.runnerPosition || hub.center;
                var distM = haversineMeters(lastPt, { lat: ev.latlng.lat, lng: ev.latlng.lng });
                var stepSec = Math.max(8, Math.round((distM / 1000) * 335));
                state.elapsedSec += stepSec;
                appendRunPoint({ lat: ev.latlng.lat, lng: ev.latlng.lng }, stepSec);
              } else {
                state.selectedTileKey = null;
                renderTileInspector();
              }
            });
          } else {
            leafletMap.invalidateSize();
            var hubKey = hub.center.lat + ',' + hub.center.lng;
            if (lastMapHubKey !== hubKey) {
              leafletMap.panTo([hub.center.lat, hub.center.lng]);
              lastMapHubKey = hubKey;
            }
          }

          if (state.focusedTileKey && state.tiles[state.focusedTileKey]) {
            var ft = state.tiles[state.focusedTileKey];
            leafletMap.panTo([ft.center.lat, ft.center.lng]);
            state.focusedTileKey = null;
          }

          // Sync Hex Tile Polygons
          Object.keys(leafletTileLayers).forEach(function (k) {
            if (!state.tiles[k]) {
              leafletMap.removeLayer(leafletTileLayers[k]);
              delete leafletTileLayers[k];
            }
          });

          leafletShieldMarkers.forEach(function (m) { leafletMap.removeLayer(m); });
          leafletShieldMarkers = [];

          Object.values(state.tiles).forEach(function (tile) {
            var isUser = tile.ownerId === profileId;
            var isShielded = isUser && tile.shieldUntil > now;
            var opts = {
              color: isShielded ? '#F59E0B' : tile.color,
              opacity: isShielded ? 0.98 : isUser ? 0.88 : 0.65,
              weight: isShielded ? 3 : isUser ? 2 : 1.25,
              fillColor: tile.color,
              fillOpacity: isShielded ? 0.44 : isUser ? 0.36 : 0.26,
            };
            var latlngs = tile.vertices.map(function (v) { return [v.lat, v.lng]; });
            if (!leafletTileLayers[tile.key]) {
              var poly = L.polygon(latlngs, opts).addTo(leafletMap);
              poly.on('click', function (ev) {
                if (state.isRunning && !state.isPaused && state.inputMode === 'manual-click') return;
                L.DomEvent.stopPropagation(ev);
                state.selectedTileKey = tile.key;
                renderTileInspector();
              });
              leafletTileLayers[tile.key] = poly;
            } else {
              leafletTileLayers[tile.key].setStyle(opts);
            }

            if (isShielded && leafletShieldMarkers.length < 30) {
              var sm = L.marker([tile.center.lat, tile.center.lng], {
                interactive: false,
                icon: L.divIcon({
                  className: '',
                  html: '<div style="width:20px;height:20px;border-radius:6px;background:#F59E0B;color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;transform:translate(-10px,-10px)">🛡</div>',
                }),
              }).addTo(leafletMap);
              leafletShieldMarkers.push(sm);
            }
          });

          // Pending trail tiles
          var activeTrailSet = new Set(state.pendingTrailKeys);
          Object.keys(leafletPendingLayers).forEach(function (k) {
            if (!activeTrailSet.has(k)) {
              leafletMap.removeLayer(leafletPendingLayers[k]);
              delete leafletPendingLayers[k];
            }
          });
          var userColor = state.profile ? state.profile.color : '#10B981';
          state.pendingTrailKeys.forEach(function (k) {
            if (!leafletPendingLayers[k]) {
              var qr = parseHexKey(k);
              var verts = getHexVertices(qr.q, qr.r, hub.center).map(function (v) { return [v.lat, v.lng]; });
              leafletPendingLayers[k] = L.polygon(verts, {
                color: userColor,
                weight: 2.5,
                fillColor: userColor,
                fillOpacity: 0.5,
                interactive: false,
              }).addTo(leafletMap);
            }
          });

          // Active Path Polyline
          if (state.activePath.length >= 2) {
            var ap = state.activePath.map(function (p) { return [p.lat, p.lng]; });
            if (!leafletActivePolyline) {
              leafletActivePolyline = L.polyline(ap, { color: '#0F172A', weight: 4.5, opacity: 0.9 }).addTo(leafletMap);
            } else {
              leafletActivePolyline.setLatLngs(ap);
            }
          } else if (leafletActivePolyline) {
            leafletMap.removeLayer(leafletActivePolyline);
            leafletActivePolyline = null;
          }

          // AI Course Polyline
          var course = getSelectedCourse();
          if (course && course.waypoints.length >= 2) {
            var cp = course.waypoints.map(function (p) { return [p.lat, p.lng]; });
            if (!leafletCoursePolyline) {
              leafletCoursePolyline = L.polyline(cp, { color: '#EA580C', weight: 4, opacity: 0.9, dashArray: '6 5' }).addTo(leafletMap);
            } else {
              leafletCoursePolyline.setLatLngs(cp);
            }
          } else if (leafletCoursePolyline) {
            leafletMap.removeLayer(leafletCoursePolyline);
            leafletCoursePolyline = null;
          }

          // Highlighted Run Polyline
          var hiRun = getHighlightedRun();
          if (hiRun && hiRun.path && hiRun.path.length >= 2) {
            var hp = hiRun.path.map(function (p) { return [p.lat, p.lng]; });
            if (!leafletHistoryPolyline) {
              leafletHistoryPolyline = L.polyline(hp, { color: '#2563EB', weight: 4.5, opacity: 0.9 }).addTo(leafletMap);
            } else {
              leafletHistoryPolyline.setLatLngs(hp);
            }
          } else if (leafletHistoryPolyline) {
            leafletMap.removeLayer(leafletHistoryPolyline);
            leafletHistoryPolyline = null;
          }

          // Runner Beacon
          var pos = state.runnerPosition || hub.center;
          var beaconHtml =
            '<div style="display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-80%);pointer-events:none">' +
              '<div style="padding:2px 6px;border-radius:6px;background:#0F172A;color:#fff;font-size:11px;font-weight:700;white-space:nowrap;margin-bottom:3px;box-shadow:0 2px 6px rgba(0,0,0,0.3)">' + escapeHtml(state.profile ? state.profile.nickname : '러너') + '</div>' +
              '<div style="width:18px;height:18px;border-radius:999px;background:' + userColor + ';border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.35)"></div>' +
            '</div>';
          if (!leafletRunnerMarker) {
            leafletRunnerMarker = L.marker([pos.lat, pos.lng], {
              interactive: false,
              zIndexOffset: 900,
              icon: L.divIcon({ className: '', html: beaconHtml }),
            }).addTo(leafletMap);
          } else {
            leafletRunnerMarker.setLatLng([pos.lat, pos.lng]);
            leafletRunnerMarker.setIcon(L.divIcon({ className: '', html: beaconHtml }));
          }

          // Start Marker
          if (state.isRunning && state.activePath.length > 0) {
            var sp = state.activePath[0];
            if (!leafletStartMarker) {
              leafletStartMarker = L.marker([sp.lat, sp.lng], {
                interactive: false,
                icon: L.divIcon({
                  className: '',
                  html: '<div style="padding:2px 6px;border-radius:6px;background:#047857;color:#fff;font-size:10px;font-weight:800;border:1px solid #fff;transform:translate(-50%,-50%)">START</div>',
                }),
              }).addTo(leafletMap);
            }
          } else if (leafletStartMarker) {
            leafletMap.removeLayer(leafletStartMarker);
            leafletStartMarker = null;
          }
        }

        function drawTacticalCanvas(derived) {
          var canvas = document.getElementById('tactical-canvas');
          if (!canvas) return;
          var rect = canvas.parentElement.getBoundingClientRect();
          var dpr = window.devicePixelRatio || 1;
          canvas.width = Math.max(300, Math.floor(rect.width * dpr));
          canvas.height = Math.max(300, Math.floor(rect.height * dpr));
          var ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);

          var W = rect.width;
          var H = rect.height;
          var hub = derived.hub;
          var scale = 0.72; // px per meter (~500m radius visible)

          function toPx(pt) {
            var m = latLngToMeters(pt, hub.center);
            return { x: W / 2 + m.x * scale, y: H / 2 - m.y * scale };
          }

          // Background street-grid
          ctx.fillStyle = '#F8FAFC';
          ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = '#E2E8F0';
          ctx.lineWidth = 1;
          for (var gx = (W / 2) % 44; gx < W; gx += 44) {
            ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
          }
          for (var gy = (H / 2) % 44; gy < H; gy += 44) {
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
          }

          // Subtle background empty hex lattice
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 0.6;
          for (var bq = -6; bq <= 6; bq++) {
            for (var br = -6; br <= 6; br++) {
              if (Math.abs(bq + br) > 7) continue;
              var bVerts = getHexVertices(bq, br, hub.center).map(toPx);
              ctx.beginPath();
              bVerts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
              ctx.closePath();
              ctx.stroke();
            }
          }

          var now = Date.now();
          var profileId = state.profile ? state.profile.id : '';

          // Owned & Rival Hex Tiles
          Object.values(state.tiles).forEach(function (tile) {
            var isUser = tile.ownerId === profileId;
            var isShielded = isUser && tile.shieldUntil > now;
            var pts = tile.vertices.map(toPx);
            ctx.beginPath();
            pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.closePath();
            ctx.fillStyle = tile.color;
            ctx.globalAlpha = isShielded ? 0.45 : isUser ? 0.36 : 0.26;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = isShielded ? '#F59E0B' : tile.color;
            ctx.lineWidth = isShielded ? 3 : isUser ? 2 : 1.2;
            ctx.stroke();

            if (isShielded) {
              var cp = toPx(tile.center);
              ctx.fillStyle = '#F59E0B';
              ctx.beginPath(); ctx.arc(cp.x, cp.y, 8, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#FFFFFF';
              ctx.font = 'bold 10px sans-serif';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('S', cp.x, cp.y);
            }
          });

          // Pending trail hexes
          var userColor = state.profile ? state.profile.color : '#10B981';
          state.pendingTrailKeys.forEach(function (k) {
            var qr = parseHexKey(k);
            var pts = getHexVertices(qr.q, qr.r, hub.center).map(toPx);
            ctx.beginPath();
            pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.closePath();
            ctx.fillStyle = userColor;
            ctx.globalAlpha = 0.5;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.strokeStyle = userColor;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          });

          // AI Course
          var course = getSelectedCourse();
          if (course && course.waypoints.length >= 2) {
            ctx.strokeStyle = '#EA580C';
            ctx.lineWidth = 3.5;
            ctx.setLineDash([7, 5]);
            ctx.beginPath();
            course.waypoints.map(toPx).forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.stroke();
            ctx.setLineDash([]);
          }

          // Highlighted run
          var hiRun = getHighlightedRun();
          if (hiRun && hiRun.path && hiRun.path.length >= 2) {
            ctx.strokeStyle = '#2563EB';
            ctx.lineWidth = 4;
            ctx.beginPath();
            hiRun.path.map(toPx).forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.stroke();
          }

          // Active Path
          if (state.activePath.length >= 2) {
            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            state.activePath.map(toPx).forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.stroke();
          }

          // Runner beacon
          var rp = toPx(state.runnerPosition || hub.center);
          ctx.fillStyle = userColor;
          ctx.beginPath(); ctx.arc(rp.x, rp.y, 9, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.fillStyle = '#0F172A';
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(state.profile ? state.profile.nickname : '러너', rp.x, rp.y - 16);

          canvas.onclick = function (ev) {
            var cRect = canvas.getBoundingClientRect();
            var px = ev.clientX - cRect.left;
            var py = ev.clientY - cRect.top;
            var mx = (px - W / 2) / scale;
            var my = (H / 2 - py) / scale;
            var pt = metersToLatLng(mx, my, hub.center);

            if (state.isRunning && !state.isPaused && state.inputMode === 'manual-click') {
              var lastPt = state.runnerPosition || hub.center;
              var distM = haversineMeters(lastPt, pt);
              var stepSec = Math.max(8, Math.round((distM / 1000) * 335));
              state.elapsedSec += stepSec;
              appendRunPoint(pt, stepSec);
            } else {
              var hex = latLngToHex(pt, hub.center);
              state.selectedTileKey = state.tiles[hex.key] ? hex.key : null;
              renderTileInspector();
            }
          };
        }

        function renderTileInspector() {
          var el = document.getElementById('tile-inspector-root');
          if (!el) return;
          if (!state.selectedTileKey || state.isRunning || !state.tiles[state.selectedTileKey]) {
            el.innerHTML = '';
            return;
          }
          var tile = state.tiles[state.selectedTileKey];
          var derived = computeDerivedStats();
          var profileId = state.profile ? state.profile.id : '';
          var now = Date.now();
          var isShielded = tile.shieldUntil > now;
          var isUser = tile.ownerId === profileId;

          el.innerHTML =
            '<div class="tile-inspector">' +
              '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
                '<div style="display:flex;align-items:center;gap:10px">' +
                  '<span style="width:14px;height:14px;border-radius:4px;background:' + tile.color + ';flex-shrink:0"></span>' +
                  '<div>' +
                    '<div style="font-size:14px;font-weight:700">' + escapeHtml(tile.ownerName) + (isUser ? ' (내 영토)' : '') + '</div>' +
                    '<div class="font-mono" style="font-size:12px;color:var(--muted)">섹터 (' + tile.q + ', ' + tile.r + ') · ' + HEX_AREA_SQM.toLocaleString() + ' m²</div>' +
                  '</div>' +
                '</div>' +
                '<button type="button" style="font-size:14px;color:var(--muted);padding:4px" data-action="close-tile-inspector">✕</button>' +
              '</div>' +
              '<div class="divider-top" style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px">' +
                (isShielded
                  ? '<span style="color:var(--amber-dark);font-weight:700">🛡 24시간 침공 면역 보호막 활성 중</span>'
                  : isUser
                  ? '<span style="color:var(--muted)">보호막 없음</span><button type="button" class="btn btn-dark btn-sm" ' + (derived.availableBonusPoints < SHIELD_COST_PER_TILE ? 'disabled' : '') + ' data-action="shield-one" data-key="' + tile.key + '">24h 보호 (-' + SHIELD_COST_PER_TILE + '점)</button>'
                  : '<span style="color:var(--muted)">달려서 밟거나 포위하면 탈환 가능</span>') +
              '</div>' +
            '</div>';
        }

        function renderMapEngine(derived) {
          var lEl = document.getElementById('leaflet-map');
          var cEl = document.getElementById('tactical-canvas');
          if (!lEl || !cEl) return;

          var useLeaflet = state.mapEngine === 'leaflet' && typeof window.L !== 'undefined';
          document.querySelectorAll('[data-action="map-engine"]').forEach(function (btn) {
            var eng = btn.getAttribute('data-engine');
            btn.classList.toggle('active', useLeaflet ? eng === 'leaflet' : eng === 'canvas');
          });
          var legendDot = document.querySelector('#map-frame-el .map-legend .color-dot');
          if (legendDot && state.profile) {
            legendDot.style.background = state.profile.color;
          }

          if (useLeaflet) {
            lEl.classList.remove('hidden');
            cEl.classList.add('hidden');
            syncLeafletMap(derived);
          } else {
            lEl.classList.add('hidden');
            cEl.classList.remove('hidden');
            drawTacticalCanvas(derived);
          }
          renderTileInspector();
        }

        function updateHudText() {
          var avgPace = state.distanceKm < 0.03 ? state.currentPaceSec : Math.round(state.elapsedSec / state.distanceKm);
          var hrZone = getHeartRateZone(state.heartRateBpm);
          var first = state.pendingTrailKeys[0] ? parseHexKey(state.pendingTrailKeys[0]) : null;
          var last = state.pendingTrailKeys.length > 0 ? parseHexKey(state.pendingTrailKeys[state.pendingTrailKeys.length - 1]) : null;
          var loopReady = state.pendingTrailKeys.length >= 6 && first && last && hexDistance(first, last) <= 2;

          var elCurPace = document.getElementById('hud-cur-pace');
          var elAvgPace = document.getElementById('hud-avg-pace');
          var elHr = document.getElementById('hud-hr');
          var elHrZone = document.getElementById('hud-hr-zone');
          var elDist = document.getElementById('hud-dist');
          var elElapsed = document.getElementById('hud-elapsed');
          var elTrail = document.getElementById('hud-trail');
          var elGpsMsg = document.getElementById('hud-gps-msg');

          if (elCurPace) elCurPace.textContent = state.isRunning ? formatPace(state.currentPaceSec) : "--'--\"";
          if (elAvgPace) elAvgPace.textContent = state.isRunning ? formatPace(avgPace) : "--'--\"";
          if (elHr) elHr.textContent = state.isRunning ? String(state.heartRateBpm) : '--';
          if (elHrZone) elHrZone.textContent = state.isRunning ? hrZone.label : '대기 중';
          if (elDist) elDist.textContent = state.distanceKm.toFixed(2);
          if (elElapsed) elElapsed.textContent = formatDuration(state.elapsedSec);
          if (elTrail) {
            elTrail.textContent = state.isRunning
              ? '획득 예정 ' + state.pendingTrailKeys.length + '칸' + (loopReady ? ' · 루프 포위 준비!' : '')
              : '러닝을 시작하면 지나간 타일이 실시간으로 표시됩니다.';
          }
          if (elGpsMsg) {
            elGpsMsg.textContent = state.gpsStatusMessage || '';
          }
        }

          updateHudText();
          renderMapEngine(computeDerivedStats());

        /* =========================================================
         * 10. EVENT BINDINGS
         * =======================================================*/
        function bindOnboardingEvents() {
          var form = document.getElementById('onboarding-form');
          var swatch = document.getElementById('ob-brand-swatch');
          var colorInput = document.getElementById('ob-color-val');
          var hubInput = document.getElementById('ob-hub-val');
          var gpsBtn = document.getElementById('ob-gps-btn');
          var gpsMsg = document.getElementById('ob-gps-msg');
          var customCenter = state.profile && state.profile.customCenter ? state.profile.customCenter : null;

          document.querySelectorAll('[data-ob-color]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var hex = btn.getAttribute('data-ob-color');
              colorInput.value = hex;
              if (swatch) swatch.style.backgroundColor = hex;
              document.querySelectorAll('[data-ob-color]').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-ob-color') === hex);
              });
            });
          });

          document.querySelectorAll('[data-ob-hub]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var hid = btn.getAttribute('data-ob-hub');
              hubInput.value = hid;
              document.querySelectorAll('[data-ob-hub]').forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-ob-hub') === hid);
              });
            });
          });

          if (gpsBtn) {
            gpsBtn.addEventListener('click', function () {
              if (!navigator.geolocation) {
                gpsMsg.textContent = '이 브라우저에서는 GPS 위치 조회를 지원하지 않습니다.';
                return;
              }
              gpsBtn.textContent = 'GPS 확인 중...';
              navigator.geolocation.getCurrentPosition(
                function (pos) {
                  customCenter = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                  hubInput.value = 'custom-gps';
                  gpsBtn.textContent = '현재 내 GPS 위치 사용';
                  gpsMsg.textContent = '현재 GPS 위치 선택됨 (' + customCenter.lat.toFixed(4) + ', ' + customCenter.lng.toFixed(4) + ')';
                  document.querySelectorAll('[data-ob-hub]').forEach(function (b) { b.classList.remove('active'); });
                },
                function () {
                  gpsBtn.textContent = '현재 내 GPS 위치 사용';
                  gpsMsg.textContent = '위치 권한이 거부되었거나 좌표를 가져오지 못했습니다. 기본 거점을 선택해 주세요.';
                },
                { enableHighAccuracy: true, timeout: 8000 }
              );
            });
          }

          var cancelBtn = document.querySelector('[data-action="cancel-edit-profile"]');
          if (cancelBtn) {
            cancelBtn.addEventListener('click', function () {
              state.editingProfile = false;
              renderApp();
            });
          }

          if (form) {
            form.addEventListener('submit', function (e) {
              e.preventDefault();
              var nick = (document.getElementById('ob-nickname').value || '').trim();
              if (nick.length < 2 || nick.length > 14) {
                document.getElementById('ob-nick-hint').textContent = '닉네임은 2자 이상 14자 이하로 입력해 주세요.';
                document.getElementById('ob-nick-hint').style.color = '#E11D48';
                return;
              }
              var starterChk = document.getElementById('ob-starter-chk');
              var includeStarter = starterChk ? starterChk.checked : false;
              var prevProfile = state.profile;
              var newProfile = {
                id: prevProfile ? prevProfile.id : 'runner-' + Date.now(),
                nickname: nick,
                color: colorInput.value,
                hubId: hubInput.value,
                customCenter: hubInput.value === 'custom-gps' ? customCenter : undefined,
                createdAt: prevProfile ? prevProfile.createdAt : Date.now(),
              };

              var nextHub = buildHubFromProfile(newProfile);
              var changingHub = prevProfile && prevProfile.hubId !== newProfile.hubId;
              if (!prevProfile || changingHub || Object.keys(state.tiles).length === 0) {
                var seededRivals = generateInitialTerritories(nextHub.center);
                if (includeStarter && !prevProfile) {
                  var starter = generateStarterRunHistory(nextHub, newProfile.id, newProfile.nickname, newProfile.color);
                  state.tiles = Object.assign({}, seededRivals, starter.userTiles);
                  state.runs = starter.runs;
                  state.conflictEvents = generateStarterConflictEvents(nextHub.name);
                } else {
                  state.tiles = seededRivals;
                  if (!prevProfile) {
                    state.runs = [];
                    state.conflictEvents = [];
                  }
                }
              } else {
                Object.keys(state.tiles).forEach(function (k) {
                  if (state.tiles[k].ownerId === newProfile.id) {
                    state.tiles[k].ownerName = newProfile.nickname;
                    state.tiles[k].color = newProfile.color;
                  }
                });
              }

              state.profile = newProfile;
              state.editingProfile = false;
              state.runnerPosition = nextHub.center;
              state.aiRecommendation = null;
              state.selectedCourseId = null;
              leafletMap = null;
              persistAll();
              renderApp();
            });
          }
        }

        function bindMainEvents() {
          // Canvas click
          var canvas = document.getElementById('tactical-canvas');
          if (canvas && canvas._canvasClickHandler) {
            canvas.onclick = canvas._canvasClickHandler;
          }

          // Weekly chart hover tooltip
          var weeklySvg = document.getElementById('weekly-svg');
          var weeklyTip = document.getElementById('weekly-tooltip');
          if (weeklySvg && weeklyTip) {
            var buckets = JSON.parse(weeklySvg.getAttribute('data-points') || '[]');
            weeklySvg.querySelectorAll('.weekly-pt').forEach(function (g) {
              g.addEventListener('mouseenter', function (ev) {
                var idx = Number(g.getAttribute('data-idx'));
                var b = buckets[idx];
                if (!b) return;
                weeklyTip.innerHTML = '<strong>' + b.label + '</strong><br>일일 +' + b.capturedTiles + '칸 · 누적 ' + b.cumulativeTiles + '칸<br>' + b.runsCount + '회 · ' + b.distanceKm.toFixed(1) + ' km';
                weeklyTip.classList.remove('hidden');
                var wrapRect = weeklySvg.parentElement.getBoundingClientRect();
                var left = Math.min(wrapRect.width - 150, Math.max(8, ev.clientX - wrapRect.left - 60));
                weeklyTip.style.left = left + 'px';
                weeklyTip.style.top = '8px';
              });
              g.addEventListener('mouseleave', function () {
                weeklyTip.classList.add('hidden');
              });
            });
          }

          // AI goal select
          var goalSel = document.getElementById('ai-goal-select');
          if (goalSel) {
            goalSel.addEventListener('change', function () {
              state.aiGoal = goalSel.value;
            });
          }

          // Challenge bonus live preview
          var chDist = document.getElementById('ch-dist-input');
          var chPreview = document.getElementById('ch-bonus-preview');
          if (chDist && chPreview) {
            chDist.addEventListener('input', function () {
              var v = Math.max(0.5, Number(chDist.value) || 0);
              var mult = state.challengeMode === 'single_run' ? 60 : 40;
              chPreview.textContent = '달성 보상 +' + Math.round(v * mult).toLocaleString() + '점';
            });
          }

          var chForm = document.getElementById('challenge-form');
          if (chForm) {
            chForm.addEventListener('submit', function (e) {
              e.preventDefault();
              var dist = Number(document.getElementById('ch-dist-input').value);
              if (!Number.isFinite(dist) || dist < 0.5 || dist > 200) return;
              var cleanDist = Number(dist.toFixed(1));
              var mult = state.challengeMode === 'single_run' ? 60 : 40;
              var rawTitle = (document.getElementById('ch-title-input').value || '').trim();
              var finalTitle = rawTitle || cleanDist + 'km ' + (state.challengeMode === 'single_run' ? '1회 완주' : '누적 달성') + ' 챌린지';
              state.challenges.unshift({
                id: 'challenge-' + Date.now(),
                title: finalTitle,
                targetDistanceKm: cleanDist,
                mode: state.challengeMode,
                bonusPoints: Math.round(cleanDist * mult),
                createdAt: Date.now(),
                completedAt: null,
              });
              state.showChallengeForm = false;
              persistAll();
              renderApp();
            });
          }

          // Photo upload file input
          var photoInput = document.getElementById('photo-file-input');
          if (photoInput) {
            photoInput.addEventListener('change', function () {
              var file = photoInput.files && photoInput.files[0];
              if (!file) return;
              var dEl = document.getElementById('pf-dist');
              var mEl = document.getElementById('pf-min');
              var sEl = document.getElementById('pf-sec');
              var hEl = document.getElementById('pf-hr');
              var dtEl = document.getElementById('pf-date');
              var lEl = document.getElementById('pf-loc');
              var cEl = document.getElementById('pf-claim');
              if (dEl) state.photoForm.distanceKm = dEl.value;
              if (mEl) state.photoForm.durationMin = mEl.value;
              if (sEl) state.photoForm.durationSec = sEl.value;
              if (hEl) state.photoForm.avgHeartRate = hEl.value;
              if (dtEl) state.photoForm.dateIso = dtEl.value;
              if (lEl) state.photoForm.locationName = lEl.value;
              if (cEl) state.photoForm.claimTerritory = cEl.checked;
              var reader = new FileReader();
              reader.onload = function (ev) {
                state.photoPreviewUrl = ev.target.result;
                renderApp();
              };
              reader.readAsDataURL(file);
            });
          }

          var photoForm = document.getElementById('photo-import-form');
          if (photoForm) {
            photoForm.addEventListener('submit', function (e) {
              e.preventDefault();
              var dist = Math.max(0.1, Number(document.getElementById('pf-dist').value) || 5);
              var mins = Math.max(1, Number(document.getElementById('pf-min').value) || 28);
              var secs = Math.max(0, Math.min(59, Number(document.getElementById('pf-sec').value) || 0));
              var totalSec = mins * 60 + secs;
              var hr = Math.max(60, Math.min(220, Number(document.getElementById('pf-hr').value) || 150));
              var dateIso = document.getElementById('pf-date').value || toLocalDateKey(Date.now());
              var loc = (document.getElementById('pf-loc').value || '').trim();
              var claim = document.getElementById('pf-claim').checked;

              handlePhotoImportSubmit({
                distanceKm: Number(dist.toFixed(2)),
                durationSec: totalSec,
                avgPaceSecPerKm: Math.round(totalSec / dist),
                avgHeartRate: hr,
                maxHeartRate: Math.min(205, hr + 16),
                locationName: loc,
                dateIso: dateIso,
                photoNote: '사진 기록 등록',
                claimTerritory: claim,
              });
            });
          }

          // Backup JSON Import
          var jsonImport = document.getElementById('import-json-input');
          if (jsonImport) {
            jsonImport.addEventListener('change', function () {
              var file = jsonImport.files && jsonImport.files[0];
              if (!file) return;
              var reader = new FileReader();
              reader.onload = function (ev) {
                try {
                  var data = JSON.parse(ev.target.result);
                  if (data.profile) state.profile = data.profile;
                  if (data.tiles) state.tiles = data.tiles;
                  if (Array.isArray(data.runs)) state.runs = data.runs;
                  if (Array.isArray(data.conflictEvents)) state.conflictEvents = data.conflictEvents;
                  if (Array.isArray(data.challenges)) state.challenges = data.challenges;
                  if (typeof data.spentBonusPoints === 'number') state.spentBonusPoints = data.spentBonusPoints;
                  if (data.notificationSettings) state.notificationSettings = data.notificationSettings;
                  leafletMap = null;
                  persistAll();
                  renderApp();
                } catch (err) {
                  state.permissionMsg = '유효한 TurfRun 백업 JSON 파일이 아닙니다.';
                  renderApp();
                }
              };
              reader.readAsText(file);
            });
          }
        }

        // Global Delegated Click Handler
        document.addEventListener('click', function (e) {
          var target = e.target.closest('[data-action]');
          if (!target) return;
          var action = target.getAttribute('data-action');

          if (action === 'tab') {
            e.preventDefault();
            state.activeTab = target.getAttribute('data-tab');
            renderApp();
          } else if (action === 'map-engine') {
            state.mapEngine = target.getAttribute('data-engine');
            renderApp();
          } else if (action === 'close-tile-inspector') {
            state.selectedTileKey = null;
            renderTileInspector();
          } else if (action === 'run-mode') {
            state.inputMode = target.getAttribute('data-mode');
            state.gpsStatusMessage = null;
            if (state.isRunning && !state.isPaused) startRunTimers();
            renderApp();
          } else if (action === 'start-run') {
            startRun(state.inputMode);
          } else if (action === 'toggle-pause') {
            state.isPaused = !state.isPaused;
            if (state.isPaused) clearRunTimers();
            else startRunTimers();
            renderApp();
          } else if (action === 'finish-run') {
            finishRun();
          } else if (action === 'generate-ai') {
            var derived = computeDerivedStats();
            state.aiRecommendation = generateLocalAiRecommendation(
              derived.hub,
              state.runs,
              state.aiGoal,
              derived.ownedTiles,
              state.profile.nickname
            );
            state.selectedCourseId = state.aiRecommendation.courses[0].id;
            renderApp();
          } else if (action === 'preview-course') {
            state.selectedCourseId = target.getAttribute('data-id');
            state.highlightedRunId = null;
            state.activeTab = 'map';
            renderApp();
          } else if (action === 'start-course') {
            var cid = target.getAttribute('data-id');
            state.selectedCourseId = cid;
            var c = getSelectedCourse();
            startRun('auto-loop', c);
          } else if (action === 'chart-mode') {
            state.chartCumulative = target.getAttribute('data-cum') === '1';
            renderApp();
          } else if (action === 'simulate-raid') {
            simulateRivalRaid();
          } else if (action === 'toggle-challenge-form') {
            state.showChallengeForm = !state.showChallengeForm;
            renderApp();
          } else if (action === 'ch-mode') {
            state.challengeMode = target.getAttribute('data-mode');
            renderApp();
          } else if (action === 'ch-preset') {
            var km = target.getAttribute('data-km');
            var inp = document.getElementById('ch-dist-input');
            var pre = document.getElementById('ch-bonus-preview');
            if (inp) inp.value = km;
            if (pre) {
              var mult = state.challengeMode === 'single_run' ? 60 : 40;
              pre.textContent = '달성 보상 +' + Math.round(Number(km) * mult).toLocaleString() + '점';
            }
          } else if (action === 'ch-filter') {
            state.challengeFilter = target.getAttribute('data-val');
            renderApp();
          } else if (action === 'delete-challenge') {
            var did = target.getAttribute('data-id');
            state.challenges = state.challenges.filter(function (c) { return c.id !== did; });
            persistAll();
            renderApp();
          } else if (action === 'prot-filter') {
            state.protectionFilter = target.getAttribute('data-val');
            renderApp();
          } else if (action === 'shield-one') {
            shieldTiles([target.getAttribute('data-key')], SHIELD_COST_PER_TILE);
          } else if (action === 'shield-bundle') {
            var now = Date.now();
            var profileId = state.profile ? state.profile.id : '';
            var rivals = Object.values(state.tiles).filter(function (t) { return t.ownerId !== profileId; });
            var unshielded = Object.values(state.tiles).filter(function (t) {
              return t.ownerId === profileId && t.shieldUntil <= now;
            }).map(function (t) {
              var near = 99999;
              rivals.forEach(function (r) { var d = haversineMeters(t.center, r.center); if (d < near) near = d; });
              return { key: t.key, near: near };
            }).sort(function (a, b) { return a.near - b.near; });
            var picks = unshielded.slice(0, 3).map(function (x) { return x.key; });
            var cost = picks.length === 3 ? SHIELD_BUNDLE_3_COST : picks.length * SHIELD_COST_PER_TILE;
            shieldTiles(picks, cost);
          } else if (action === 'focus-tile') {
            var fk = target.getAttribute('data-key');
            state.focusedTileKey = fk;
            state.selectedTileKey = fk;
            state.activeTab = 'map';
            renderApp();
          } else if (action === 'ach-filter') {
            state.achievementFilter = target.getAttribute('data-val');
            renderApp();
          } else if (action === 'toggle-ach') {
            var aid = target.getAttribute('data-id');
            state.expandedAchievementId = state.expandedAchievementId === aid ? null : aid;
            renderApp();
          } else if (action === 'select-run') {
            var rid = target.getAttribute('data-id');
            state.highlightedRunId = state.highlightedRunId === rid ? null : rid;
            if (state.highlightedRunId) state.selectedCourseId = null;
            renderApp();
          } else if (action === 'clear-run-highlight') {
            state.highlightedRunId = null;
            renderApp();
          } else if (action === 'edit-profile') {
            state.editingProfile = true;
            renderApp();
          } else if (action === 'toggle-master-alert') {
            state.notificationSettings.raidAlertsEnabled = !state.notificationSettings.raidAlertsEnabled;
            persistAll();
            renderApp();
          } else if (action === 'toggle-inapp-alert') {
            state.notificationSettings.inAppBannerEnabled = !state.notificationSettings.inAppBannerEnabled;
            persistAll();
            renderApp();
          } else if (action === 'toggle-push-alert') {
            if (!('Notification' in window)) {
              state.permissionMsg = '현재 브라우저 환경에서는 네이티브 푸시 알림을 지원하지 않습니다. 인앱 배너를 이용해 주세요.';
              renderApp();
              return;
            }
            if (!state.notificationSettings.browserPushEnabled) {
              if (Notification.permission === 'default') {
                Notification.requestPermission().then(function (res) {
                  if (res === 'granted') {
                    state.notificationSettings.raidAlertsEnabled = true;
                    state.notificationSettings.browserPushEnabled = true;
                    state.permissionMsg = '브라우저 푸시 알림 권한이 허용되었습니다.';
                  } else {
                    state.permissionMsg = '브라우저 알림 권한이 거부되었습니다. 인앱 푸시 배너는 계속 작동합니다.';
                  }
                  persistAll();
                  renderApp();
                }).catch(function () {
                  state.permissionMsg = '현재 환경에서는 브라우저 권한 요청이 제한될 수 있습니다. 인앱 배너를 이용해 주세요.';
                  renderApp();
                });
                return;
              } else if (Notification.permission === 'denied') {
                state.permissionMsg = '브라우저 설정에서 알림이 차단되어 있습니다. 인앱 배너를 이용해 주세요.';
                renderApp();
                return;
              }
              state.notificationSettings.browserPushEnabled = true;
            } else {
              state.notificationSettings.browserPushEnabled = false;
            }
            persistAll();
            renderApp();
          } else if (action === 'send-test-alert') {
            var hub = getActiveHub();
            var rival = RIVAL_SEEDS[0];
            dispatchRaidNotification({
              id: 'test-raid-' + Date.now(),
              type: 'stolen_by_rival',
              rivalName: rival.name,
              rivalColor: rival.color,
              tilesCount: 2,
              timestamp: Date.now(),
              hubName: hub.name,
            });
          } else if (action === 'dismiss-toast') {
            state.activeRaidAlert = null;
            renderRaidToast();
          } else if (action === 'toast-view-map') {
            state.activeRaidAlert = null;
            state.activeTab = 'map';
            renderApp();
          } else if (action === 'close-summary') {
            state.completedSummaryRun = null;
            renderApp();
          } else if (action === 'summary-to-coach') {
            state.completedSummaryRun = null;
            state.activeTab = 'coach';
            renderApp();
          } else if (action === 'open-photo-modal') {
            state.showPhotoModal = true;
            renderApp();
          } else if (action === 'close-photo-modal') {
            state.showPhotoModal = false;
            state.photoPreviewUrl = null;
            renderApp();
          } else if (action === 'photo-preset') {
            document.getElementById('pf-dist').value = target.getAttribute('data-km');
            document.getElementById('pf-min').value = target.getAttribute('data-min');
            document.getElementById('pf-sec').value = target.getAttribute('data-sec');
            document.getElementById('pf-hr').value = target.getAttribute('data-hr');
          } else if (action === 'export-html' || action === 'download-html-blob') {
            var docClone = document.documentElement.cloneNode(true);
            var appPlaceholder = docClone.querySelector('#app');
            if (appPlaceholder) appPlaceholder.innerHTML = '';
            docClone.querySelectorAll('script[src*="/@vite"]').forEach(function (s) {
              if (s.parentNode) s.parentNode.removeChild(s);
            });
            var htmlSource = '<!doctype html>\n' + docClone.outerHTML;
            state.exportHtmlCache = htmlSource;
            state.showExportModal = true;
            try {
              var htmlBlob = new Blob([htmlSource], { type: 'text/html;charset=utf-8' });
              var htmlUrl = URL.createObjectURL(htmlBlob);
              var htmlLink = document.createElement('a');
              htmlLink.href = htmlUrl;
              htmlLink.download = 'index.html';
              document.body.appendChild(htmlLink);
              htmlLink.click();
              document.body.removeChild(htmlLink);
              setTimeout(function () { URL.revokeObjectURL(htmlUrl); }, 1500);
              state.exportModalStatus = '브라우저 다운로드를 요청했습니다. 파일이 내려받아지지 않으면 위 "index.html 바로 다운로드" 또는 "HTML 전체 코드 복사"를 이용해 주세요.';
            } catch (err) {
              state.exportModalStatus = '아래 "HTML 전체 코드 복사" 버튼을 눌러 index.html로 저장해 주세요.';
            }
            state.exportNotice = 'index.html 저장 창을 열었습니다.';
            renderApp();
          } else if (action === 'close-export-modal') {
            state.showExportModal = false;
            state.exportModalStatus = null;
            renderApp();
          } else if (action === 'mark-direct-download') {
            setTimeout(function () {
              state.exportModalStatus = '직접 다운로드(/download/index.html)를 요청했습니다. 다운로드 폴더를 확인해 주세요.';
              if (state.showExportModal) renderApp();
            }, 150);
          } else if (action === 'save-html-picker') {
            var contentToSave = state.exportHtmlCache || ('<!doctype html>\n' + document.documentElement.outerHTML);
            if (typeof window.showSaveFilePicker === 'function') {
              window.showSaveFilePicker({
                suggestedName: 'index.html',
                types: [{ description: 'HTML File', accept: { 'text/html': ['.html'] } }],
              }).then(function (handle) {
                return handle.createWritable().then(function (writable) {
                  return writable.write(contentToSave).then(function () { return writable.close(); });
                });
              }).then(function () {
                state.exportModalStatus = '선택한 폴더에 index.html 저장을 완료했습니다!';
                renderApp();
              }).catch(function () {
                state.exportModalStatus = '현재 미리보기 창에서는 파일 선택기가 제한될 수 있습니다. "HTML 전체 코드 복사"를 이용해 주세요.';
                renderApp();
              });
            } else {
              state.exportModalStatus = '이 브라우저는 파일 선택기 저장을 지원하지 않습니다. "브라우저 파일 저장 (Blob)" 또는 "HTML 전체 코드 복사"를 이용해 주세요.';
              renderApp();
            }
          } else if (action === 'copy-html-source') {
            var srcText = state.exportHtmlCache || '';
            var ta = document.getElementById('export-html-textarea');
            var copied = false;
            if (ta) {
              ta.focus();
              ta.select();
              ta.setSelectionRange(0, srcText.length);
              try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(srcText).then(function () {
                state.exportModalStatus = 'index.html 전체 코드가 클립보드에 복사되었습니다! 메모장·VS Code에 붙여넣어 index.html로 저장하세요.';
                renderApp();
              }).catch(function () {
                state.exportModalStatus = copied
                  ? 'index.html 전체 코드가 복사되었습니다! 메모장·VS Code에 붙여넣어 index.html로 저장하세요.'
                  : '아래 입력란을 Ctrl+A → Ctrl+C로 복사해 index.html로 저장하세요.';
                renderApp();
              });
            } else {
              state.exportModalStatus = copied
                ? 'index.html 전체 코드가 복사되었습니다! 메모장·VS Code에 붙여넣어 index.html로 저장하세요.'
                : '아래 입력란을 Ctrl+A → Ctrl+C로 복사해 index.html로 저장하세요.';
              renderApp();
            }
          } else if (action === 'select-export-textarea') {
            var box = document.getElementById('export-html-textarea');
            if (box) {
              box.focus();
              box.select();
              box.setSelectionRange(0, box.value.length);
            }
          } else if (action === 'copy-vercel-json') {
            var vText = JSON.stringify({ buildCommand: '', outputDirectory: '.' }, null, 2);
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(vText).then(function () {
                state.exportModalStatus = 'vercel.json 내용이 클립보드에 복사되었습니다.';
                renderApp();
              }).catch(function () {
                state.exportModalStatus = 'vercel.json: ' + vText;
                renderApp();
              });
            }
          } else if (action === 'export-vercel-json') {
            var vercelConfig = JSON.stringify({ buildCommand: '', outputDirectory: '.' }, null, 2) + '\n';
            var vBlob = new Blob([vercelConfig], { type: 'application/json;charset=utf-8' });
            var vUrl = URL.createObjectURL(vBlob);
            var vLink = document.createElement('a');
            vLink.href = vUrl;
            vLink.download = 'vercel.json';
            document.body.appendChild(vLink);
            vLink.click();
            document.body.removeChild(vLink);
            setTimeout(function () { URL.revokeObjectURL(vUrl); }, 1000);
            state.exportNotice = 'vercel.json 파일 다운로드를 요청했습니다.';
            state.exportModalStatus = 'vercel.json 파일 다운로드를 요청했습니다.';
            renderApp();
          } else if (action === 'export-json') {
            var payload = {
              exportedAt: new Date().toISOString(),
              profile: state.profile,
              tiles: state.tiles,
              runs: state.runs,
              conflictEvents: state.conflictEvents,
              challenges: state.challenges,
              spentBonusPoints: state.spentBonusPoints,
              notificationSettings: state.notificationSettings,
            };
            var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'turfrun-backup-' + toLocalDateKey(Date.now()) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          } else if (action === 'reset-all-data') {
            Object.values(STORAGE_KEYS).forEach(function (k) { localStorage.removeItem(k); });
            clearRunTimers();
            state.profile = null;
            state.tiles = {};
            state.runs = [];
            state.conflictEvents = [];
            state.challenges = [];
            state.spentBonusPoints = 0;
            state.aiRecommendation = null;
            state.selectedCourseId = null;
            leafletMap = null;
            renderApp();
          }
        });

        // Keyboard WASD / Arrow running in manual-click mode
        window.addEventListener('keydown', function (e) {
          if (!state.isRunning || state.isPaused || state.inputMode !== 'manual-click') return;
          var stepDeg = 0.00048;
          var dLat = 0, dLng = 0;
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dLat = stepDeg;
          else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dLat = -stepDeg;
          else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dLng = -stepDeg * 1.2;
          else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dLng = stepDeg * 1.2;
          else return;
          e.preventDefault();
          var pos = state.runnerPosition || getActiveHub().center;
          state.elapsedSec += 14;
          appendRunPoint({ lat: pos.lat + dLat, lng: pos.lng + dLng }, 15);
        });

        window.addEventListener('resize', function () {
          if (state.profile && !state.editingProfile && state.mapEngine === 'canvas') {
            drawTacticalCanvas(computeDerivedStats());
          }
        });

        // Initial Boot
        renderApp();
      })();
    </script>
